# dsh-selftest - derived self-check for changed files.
# Loaded as a profile bundle; the check logic lives in lib/*.js and is also
# reachable from the command line through lib/cli.js.

- insert:
    - id: dsh-selftest
      name: dsh-selftest
      # Whistle: at the end of a turn that wrote files, name the changes that
      # were never verified by selftest. It only speaks; it never blocks.
      # Uncomment to tune it.
      # config:
      #   whistleMode: warn          # warn | strict | off
      #   maxWhistlesPerSession: 2
      #   requireWhistleAfterWrite: true
      #   hardGate: nag              # nag | off
